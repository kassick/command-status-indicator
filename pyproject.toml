[project]
name = "cmd-status-appindicator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "PyGObject>=3.40", # Specify a minimum version if needed
    "pyyaml>=6.0.3",
]

[project.scripts]
command-status-indicator = "command_status_indicator:main"

[tool.uv]
package = true
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3" } }

[dependency-groups]
dev = [
    "pygobject-stubs>=2.16.0",
]
